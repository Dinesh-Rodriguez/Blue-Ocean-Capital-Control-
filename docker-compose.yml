services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: capex
      POSTGRES_USER: capex
      POSTGRES_PASSWORD: capex
    ports: ["5432:5432"]
  redis:
    image: redis:7
  api:
    build: ./backend
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes: ["./backend:/app"]
    working_dir: /app
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: capex
      DB_USER: capex
      DB_PASSWORD: capex
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: ./backend
    command: celery -A config.celery.app worker -l info
    volumes: ["./backend:/app"]
    working_dir: /app
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: capex
      DB_USER: capex
      DB_PASSWORD: capex
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on: [api, redis]
  frontend:
    image: node:20
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [api]

